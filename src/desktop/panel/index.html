<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBus</title>
<style>
  :root {
    --panel: #F5F5F7;
    --text: #1D1B20;
    --sub: #57534E;
    --muted: #8E8E93;
    --line: rgba(29, 27, 32, 0.08);
    --hover: rgba(29, 27, 32, 0.05);
    --track-off: #E4E4E7;
    --track-on: #1D1B20;
    --knob: #FFFFFF;
    --danger: #D92D20;
    --warn: #9A6A1F;
    --ok: #557A63;
    --warn-dot: #C98A2E;
    --icon-bg: #ECECEF;
  }
  html.dark {
    --panel: #1C1C1E;
    --text: #F2F2F7;
    --sub: #C7C7CC;
    --muted: #8E8E93;
    --line: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --track-off: #3A3A3C;
    --track-on: #F2F2F7;
    --knob: #1C1C1E;
    --danger: #FF6961;
    --warn: #E0B15C;
    --ok: #7FA98D;
    --warn-dot: #E0B15C;
    --icon-bg: #2C2C2E;
  }
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont,
      "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .wrap { padding: 0; }
  .panel {
    width: 272px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 560px;
    scrollbar-width: thin;
  }
  .header { padding: 12px 12px 8px; }
  .statusline { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.connected { background: var(--ok); }
  .dot.disconnected { background: var(--warn-dot); }
  .host { margin: 3px 0 0 13px; font-size: 10.5px; color: var(--muted); }
  .section { padding: 0 6px; }
  .section-title { padding: 5px 6px 2px; font-size: 10.5px; color: var(--muted); }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 7px;
    cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row.disabled { cursor: default; opacity: 0.52; }
  .row.disabled:hover { background: transparent; }
  .icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--icon-bg);
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .state { font-size: 10.5px; color: var(--muted); white-space: nowrap; flex: none; }
  .state.error { color: var(--danger); }
  .state.off { color: var(--warn); }
  .err {
    font-size: 10.5px;
    line-height: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .detail {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 10.5px;
    color: var(--muted);
    padding: 0 2px;
    cursor: pointer;
    flex: none;
  }
  .detail:hover { color: var(--text); text-decoration: underline; }
  .switch {
    position: relative;
    width: 30px;
    height: 18px;
    border-radius: 9px;
    background: var(--track-off);
    flex: none;
    transition: background 0.15s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  .switch.on { background: var(--track-on); }
  html.dark .switch.on::after { background: var(--knob); }
  .switch.on::after { transform: translateX(12px); }
  .empty { padding: 6px 8px 8px; font-size: 11.5px; color: var(--muted); }
  .entries { margin: 5px 6px 0; padding-top: 1px; border-top: 1px solid var(--line); }
  .erow { padding: 6px; border-radius: 7px; font-size: 12px; color: var(--sub); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .erow:hover { background: var(--hover); color: var(--text); }
  .problems { margin: 5px 6px 0; border-top: 1px solid var(--line); padding-top: 1px; }
  .problems-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 6px 4px;
    font-size: 10.5px;
    color: var(--muted);
    cursor: pointer;
  }
  .problem { padding: 2px 6px 4px; font-size: 10.5px; color: var(--muted); line-height: 1.45; word-break: break-all; }
  .problem b { display: block; font-weight: 600; color: var(--sub); }
  .link { display: inline-block; padding: 3px 6px; font-size: 10.5px; color: var(--sub); cursor: pointer; border-radius: 4px; }
  .link:hover { background: var(--hover); color: var(--text); }
  .footer {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    margin-top: 6px;
    padding: 5px 8px 6px;
  }
  .footer button {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 11.5px;
    color: var(--sub);
    padding: 5px 7px;
    border-radius: 5px;
    cursor: pointer;
  }
  .footer button:hover { background: var(--hover); color: var(--text); }
  .footer button.quit { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap"><div class="panel" id="panel"></div></div>
<script>
  const api = window.agentbus;
  let view = null;
  let problemsOpen = false;

  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function stateClass(agent) {
    if (agent.state === "出错") return "state error";
    if (agent.state === "已停用") return "state off";
    return "state";
  }

  function agentRow(agent) {
    const classes = ["row"];
    if (!agent.available) classes.push("disabled");
    // 错误摘要只是说明，不做成可点；装了但出错的行另外给「详情」
    const errorLine = agent.errorText
      ? `<span class="err">${esc(agent.errorText)}</span>`
      : "";
    const detail = agent.hasError
      ? `<button class="detail" data-error="${esc(agent.id)}">详情</button>`
      : "";
    // 未安装没有可操作项，不画开关；状态自然顶到最右
    const switchHtml = agent.available
      ? `<span class="switch ${agent.enabled ? "on" : ""}" role="switch" aria-checked="${agent.enabled}"></span>`
      : "";
    return `<div class="${classes.join(" ")}" data-agent="${esc(agent.id)}" role="button" tabindex="0">
      <span class="icon"><img src="${esc(agent.icon)}" alt=""></span>
      <span class="text">
        <span class="top">
          <span class="name">${esc(agent.name)}</span>
          <span class="${stateClass(agent)}">${esc(agent.state)}</span>
          ${detail}
        </span>
        ${errorLine}
      </span>
      ${switchHtml}
    </div>`;
  }

  function entriesSection(items) {
    if (!items || !items.length) return "";
    return `<div class="entries">${items
      .map((entry) => `<div class="erow" data-entry="${esc(entry.id)}" role="button" tabindex="0">${esc(entry.label)}</div>`)
      .join("")}</div>`;
  }

  function problemsSection(items) {
    if (!items.length) return "";
    const rows = items
      .map((item) => `<div class="problem"><b>${esc(item.file)}</b>${esc(item.reason)}</div>`)
      .join("");
    const body = problemsOpen
      ? `${rows}<span class="link" data-action="copy-problems">复制诊断信息</span>`
      : "";
    return `<div class="problems">
      <div class="problems-head" data-action="toggle-problems">
        <span>ACP 清单问题（${items.length}）</span>
        <span>${problemsOpen ? "收起" : "展开"}</span>
      </div>
      ${body}
    </div>`;
  }

  function render() {
    if (!view) return;
    const agents = view.agents.length
      ? view.agents.map(agentRow).join("")
      : `<div class="empty">未发现本机 Agent</div>`;
    document.getElementById("panel").innerHTML = `
      <div class="header">
        <div class="statusline"><span class="dot ${esc(view.connection)}"></span>${esc(view.statusLabel)}</div>
        <div class="host">${esc(view.hostName)}</div>
      </div>
      <div class="section">
        <div class="section-title">本机 Agent</div>
        ${agents}
      </div>
      ${problemsSection(view.problems)}
      ${entriesSection(view.entries)}
      <div class="footer">
        <button data-action="refresh">刷新列表</button>
        <button class="quit" data-action="quit">退出</button>
      </div>`;
    requestAnimationFrame(() => {
      api.resize(Math.ceil(document.querySelector(".wrap").scrollHeight));
    });
  }

  function toggleRow(row) {
    if (!row || !view) return;
    const agent = view.agents.find((item) => item.id === row.getAttribute("data-agent"));
    if (agent && agent.available) api.toggle(agent.id, !agent.enabled);
  }

  document.getElementById("panel").addEventListener("click", (event) => {
    const target = event.target;
    const actionEl = target.closest("[data-action]");
    if (actionEl) {
      const action = actionEl.getAttribute("data-action");
      if (action === "refresh") api.refresh();
      if (action === "quit") api.quit();
      if (action === "copy-problems") api.copyProblems();
      if (action === "toggle-problems") {
        problemsOpen = !problemsOpen;
        render();
      }
      return;
    }
    const entry = target.closest("[data-entry]");
    if (entry) {
      api.entry(entry.getAttribute("data-entry"));
      return;
    }
    const errorEl = target.closest("[data-error]");
    if (errorEl) {
      api.showError(errorEl.getAttribute("data-error"));
      return;
    }
    toggleRow(target.closest("[data-agent]"));
  });

  document.getElementById("panel").addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const row = event.target.closest("[data-agent]");
    if (row) {
      event.preventDefault();
      toggleRow(row);
    }
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape") api.close();
  });
  window.addEventListener("contextmenu", (event) => event.preventDefault());
  // 面板本身之外没有留白，这里只兜底 body 点击
  document.body.addEventListener("click", (event) => {
    const target = event.target;
    if (target === document.body || (target.classList && target.classList.contains("wrap"))) {
      api.close();
    }
  });

  api.onView((next, theme) => {
    document.documentElement.classList.toggle("dark", theme === "dark");
    view = next;
    render();
  });
  api.ready();
</script>
</body>
</html>
